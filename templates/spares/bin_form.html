{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}

{% block topbar_actions %}
  <button form="main-form" class="btn btn-sm btn-primary"><i class="fas fa-save me-1"></i> Save</button>
  <a href="{% url 'spares:bin_list' %}" class="btn btn-sm btn-outline-secondary"><i class="fas fa-arrow-left me-1"></i> Back</a>
{% endblock %}

{% block content %}
<form method="post" id="main-form">
  {% csrf_token %}
  <div class="card" style="max-width:500px">
    <div class="card-header">Bin Details</div>
    <div class="card-body">
      <div class="mb-3">
        <label class="form-label fw-semibold">Bin Name <span class="text-danger">*</span></label>
        {{ form.name }}
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Rack <span class="text-danger">*</span></label>
        {{ form.rack }}
      </div>
    </div>
  </div>
</form>
{% endblock %}
