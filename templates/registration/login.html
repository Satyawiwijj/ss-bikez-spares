<!DOCTYPE html>
<html>
<head>
  <title>Login — SS Bikez Spares</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f4f6f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #fff; border-radius: 12px; padding: 40px; width: 380px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .brand { color: #2d5016; font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .btn-primary { background: #2d5016; border-color: #2d5016; }
    .btn-primary:hover { background: #4a7c28; border-color: #4a7c28; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="brand"><i class="fas fa-motorcycle"></i> SS Bikez Spares</div>
    <p class="text-muted small mb-4">Sign in to your account</p>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
        <div class="alert alert-danger">Invalid username or password.</div>
      {% endif %}
      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" name="username" class="form-control" autofocus required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign In</button>
    </form>
  </div>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</body>
</html>
